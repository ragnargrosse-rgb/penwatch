watchlists:

  # ============================================================
  # SOENNECKEN 111 / 222 + PENCILS 11 / 22
  # ============================================================

  - id: soennecken-111-222
    name: "Soennecken 111 / 222 / 11 / 22"
    enabled: true

    include_groups:
      -
        - "soennecken"
        - "sönnecken"
      -
        - exact: "111"
        - exact: "222"
        - exact: "11"
        - exact: "22"

    sources:
      reddit:
        enabled: true
        subreddits:
          - "Pen_Swap"
      ebay:
        enabled: true

    notification:
      title: "PenWatch - Soennecken"


  # ============================================================
